name: Build S11 Workspace

on:
  push:
    branches: [ tab-s11 ]
  workflow_dispatch:

concurrency:
  group: build-s11-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null
          command -v zstd || sudo apt-get install -y zstd

      # The bundled archives carry the install path /data/data/com.winlator;
      # rewrite it for com.winlatab. Slow (about 4 min), so cache the result.
      - name: Restore patched assets
        id: assets-cache
        uses: actions/cache/restore@v4
        with:
          path: .s11-cache
          key: s11-assets-${{ hashFiles('app/src/main/assets/**', 'tools/s11/patch_assets.py') }}

      - name: Patch assets
        run: |
          if [ "${{ steps.assets-cache.outputs.cache-hit }}" = "true" ]; then
            cp -r .s11-cache/assets/. app/src/main/assets/
            echo "used cached patched assets"
          else
            python3 tools/s11/patch_assets.py app/src/main/assets
            mkdir -p .s11-cache/assets
            git diff --name-only -- app/src/main/assets | while read -r f; do
              rel="${f#app/src/main/assets/}"
              mkdir -p ".s11-cache/assets/$(dirname "$rel")"
              cp "$f" ".s11-cache/assets/$rel"
            done
          fi
          if zstd -dc app/src/main/assets/rootfs.tzst | grep -aqF /data/data/com.winlator/; then
            echo "::error::rootfs still contains the old install path"; exit 1
          fi

      - name: Save patched assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .s11-cache
          # The key computed before patching; hashing again here would see the patched files
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      - name: Build S11 rootfs overlay
        run: python3 tools/s11/build_overlay.py tools/s11/rootfs-overlay app/src/main/assets

      # The keystore in tools/s11/signing is encrypted (PKCS12, AES-256); only its
      # password lives in the repository secret S11_KEYSTORE_PASSWORD.
      - name: Signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.S11_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "S11_KEYSTORE=$GITHUB_WORKSPACE/tools/s11/signing/s11-release.p12" >> "$GITHUB_ENV"
            echo "S11_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret S11_KEYSTORE_PASSWORD is missing: this build is a compile check only and is not published"
            echo "S11_SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          S11_KEYSTORE_PASSWORD: ${{ secrets.S11_KEYSTORE_PASSWORD }}
          S11_KEY_ALIAS: s11
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          OUT="S11-Workspace-build${GITHUB_RUN_NUMBER}.apk"
          mv "$APK" "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      # Job logs live in blob storage the build session cannot reach, so failed
      # builds leave their log on the s11-ci-log branch instead.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/logrepo" && cd "$RUNNER_TEMP/logrepo"
          {
            echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}"
            if [ -f "$LOG" ]; then
              grep -nE "error:|e: |FAILED|What went wrong|Caused by|undefined reference|fatal" "$LOG" | head -200
              echo "----- tail -----"
              tail -400 "$LOG"
            else
              echo "no build log (failed before the Gradle step)"
            fi
          } > build-log.txt
          git init -q
          git config user.name "s11-ci"
          git config user.email "s11-ci@users.noreply.github.com"
          git add build-log.txt
          git commit -qm "build ${GITHUB_RUN_NUMBER} log"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/s11-ci-log

      - uses: actions/upload-artifact@v4
        with:
          name: s11-workspace-build${{ github.run_number }}
          path: ${{ env.APK_FILE }}

      - name: Publish release
        if: env.S11_SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "s11-build${GITHUB_RUN_NUMBER}" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "S11 Workspace build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --format='%s%n%n%b')"
