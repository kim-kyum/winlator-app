name: S11 UI screenshots

# Builds the app and takes screenshots of its Android screens in an emulator, pushed to the
# s11-ui-results branch (the build session cannot see job logs or artifacts).
on:
  push:
    branches: [ s11-ui ]
  workflow_dispatch:

concurrency:
  group: s11-ui
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null
          command -v zstd || sudo apt-get install -y zstd

      - name: Restore patched assets
        id: assets-cache
        uses: actions/cache/restore@v4
        with:
          path: .s11-cache
          key: s11-assets-${{ hashFiles('app/src/main/assets/**', 'tools/s11/patch_assets.py') }}

      - name: Patch assets
        run: |
          if [ "${{ steps.assets-cache.outputs.cache-hit }}" = "true" ]; then
            cp -r .s11-cache/assets/. app/src/main/assets/
          else
            python3 tools/s11/patch_assets.py app/src/main/assets
          fi

      - name: Build S11 rootfs overlay
        run: python3 tools/s11/build_overlay.py tools/s11/rootfs-overlay app/src/main/assets

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build.log"; exit 1; }
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" "$RUNNER_TEMP/app.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disk-size: 8G
          ram-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/s11/ui/shots.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/shots"

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}" > run.txt
          git init -q
          git config user.name "s11-ui"
          git config user.email "s11-ui@users.noreply.github.com"
          git add -A
          git commit -qm "ui run ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/s11-ui-results
